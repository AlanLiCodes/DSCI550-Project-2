[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vesselnoise"
version = "0.1.0"
description = "Estimating added vessel noise in underwater acoustic band-level data (Zindi Underwater Vessel Noise Challenge, DSCI 550 Project 2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
cnn = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
